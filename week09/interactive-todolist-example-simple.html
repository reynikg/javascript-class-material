<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Elements - ToDo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            padding: 40px;
        }
        .app-container {
            background: white;
            max-width: 400px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2ecc71; }
        
        /* Στυλ για τις δυναμικές εργασίες */
        .task-item {
            background: #ecf0f1;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .delete-btn {
            background: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover { background: #c0392b; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Λίστα Εργασιών</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Νέα εργασία...">
            <button id="addBtn">Προσθήκη</button>
        </div>

        <div id="taskList"></div>
    </div>

    <script>
        const inputEl = document.querySelector("#taskInput");
        const addBtn = document.querySelector("#addBtn");
        const taskList = document.querySelector("#taskList");

        addBtn.addEventListener("click", function() {
            let taskText = inputEl.value.trim();

            if (taskText === "") {
                alert("Παρακαλώ γράψτε μια εργασία.");
                return;
            }

            // 1. ΔΗΜΙΟΥΡΓΙΑ ΤΟΥ ΚΟΥΤΙΟΥ (Το εξωτερικό div)
            let taskBox = document.createElement("div");
            taskBox.classList.add("task-item");

            // 2. ΔΗΜΙΟΥΡΓΙΑ ΤΟΥ ΚΕΙΜΕΝΟΥ
            let textSpan = document.createElement("span");
            textSpan.textContent = taskText;

            // 3. ΔΗΜΙΟΥΡΓΙΑ ΤΟΥ ΚΟΥΜΠΙΟΥ ΔΙΑΓΡΑΦΗΣ
            let delBtn = document.createElement("button");
            delBtn.textContent = "Διαγραφή";
            delBtn.classList.add("delete-btn");

            // Λογική Διαγραφής: Όταν πατηθεί αυτό το κουμπί, 
            // διέγραψε ολόκληρο το κουτί της εργασίας!
            delBtn.addEventListener("click", function() {
                taskBox.remove(); 
            });

            // 4. ΣΥΝΑΡΜΟΛΟΓΗΣΗ (Κολλάμε το κείμενο και το κουμπί μέσα στο taskBox)
            taskBox.append(textSpan);
            taskBox.append(delBtn);

            // 5. ΤΟΠΟΘΕΤΗΣΗ ΣΤΗ ΣΕΛΙΔΑ (Κολλάμε το taskBox στη λίστα)
            // Χρησιμοποιούμε prepend για να μπαίνουν οι νέες δουλειές στην κορυφή!
            taskList.prepend(taskBox);

            // 6. Καθαρισμός του Input
            inputEl.value = "";
        });
    </script>
</body>
</html>
